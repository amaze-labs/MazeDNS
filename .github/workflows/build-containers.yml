# On every push to main:
#   1. compute the next version from the latest semver tag plus the commits after
#      it (type!: major, feat: minor, anything else: patch — see
#      .github/scripts/next-version.sh);
#   2. publish BOTH images (control plane and agent) as <version> and latest.
#      Each one is rebuilt only when something that ends up in IT changed since
#      the previous release: the packages its binary imports (go list), the web
#      UI for the control plane, and the shared go.mod, Dockerfile and configs.
#      An image that didn't change is the previous release's, stamped with the
#      new version: a FROM + ENV layer, no compile;
#   3. only once both images are published, create and push the git tag <version>
#      (no "v" prefix).
#
# The two images always carry the same version, and each binary reports it
# (in its startup log, and the app version agents send to the control plane). A rebuilt
# binary has it compiled in; a stamped one reads MAZEDNS_IMAGE_VERSION. The
# control plane also learns the release its agent code comes from (AgentBuild),
# so an agent on an earlier version isn't flagged as outdated when the releases
# since then only changed the control plane.
#
# A push that only changes documentation (docs/, *.md, LICENSE) or CI (.github/)
# releases nothing: it doesn't start the workflow at all, and when it runs anyway
# (a push mixing those with the workflow file, say) the version job skips. Those
# commits ship with the next release; `docs:` commits don't bump its version.
# Run the workflow by hand to release CI-only changes.
#
# Pushing the tag does not re-trigger this workflow (it only runs on branches).
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# One release at a time, in order: two quick pushes must not compute the same
# version.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write   # push the tag
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
      skip: ${{ steps.next.outputs.skip }}
      build_cp: ${{ steps.changed.outputs.build_cp }}
      build_agent: ${{ steps.changed.outputs.build_agent }}
      any: ${{ steps.changed.outputs.any }}
      cp_build: ${{ steps.changed.outputs.cp_build }}
      agent_build: ${{ steps.changed.outputs.agent_build }}
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history for git describe and the log
          fetch-tags: true

      - name: Next version
        id: next
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          version=$(.github/scripts/next-version.sh)
          previous=$(.github/scripts/next-version.sh --previous)
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          # What changed since the last release, minus documentation and CI.
          shipped=""
          if [ -n "$previous" ]; then
            shipped=$(git diff --name-only "$previous" HEAD | grep -Ev '^(docs/|\.github/)|\.md$|^LICENSE$' || true)
          fi
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "HEAD is already tagged ${version}: nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$previous" ] && [ -z "$shipped" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "Only documentation or CI changed since ${previous}: nothing to release."
            echo "### Nothing to release: only documentation or CI changed" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

      # The comparison is against the last RELEASED version, not the previous
      # push: a release that failed halfway doesn't leave an image behind. A git
      # tag only exists once both images were published (see the `tag` job), so
      # both images of `previous` are guaranteed to exist and can be stamped.
      #
      # Each image's inputs are its binary's packages (go list -deps, so a
      # package only the other binary imports doesn't count) plus the shared
      # files below. Err on the side of too many: an extra path costs a useless
      # build, a missing one ships a stale image.
      - uses: actions/setup-go@v5
        if: steps.next.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: Log in to container registry
        if: steps.next.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Which images changed?
        id: changed
        if: steps.next.outputs.skip != 'true'
        env:
          PREV: ${{ steps.next.outputs.previous }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euf   # -f: the :(glob) pathspecs below must reach git unexpanded
          shared="go.mod go.sum Dockerfile .dockerignore configs"
          specs() {  # $1 = cmd/<binary>: its package dirs as pathspecs
            go list -e -tags embed_dist -deps -f '{{if .Module}}{{if .Module.Main}}{{.Dir}}{{end}}{{end}}' "./$1" |
              sed "s|^$PWD/||; s|.*|:(glob)&/**|"
          }
          changed() {  # $@ = pathspecs; prints what changed since PREV, tests aside
            git diff --name-only "$PREV" HEAD -- "$@" | grep -v '_test\.go$' || true
          }
          # The release an image's code comes from: this one when rebuilt,
          # otherwise the one the previous image was built at (its label).
          built_at() {  # $1 = image suffix
            img="${REGISTRY}/${GITHUB_REPOSITORY,,}-$1:${PREV}"
            label=$(docker buildx imagetools inspect "$img" --format '{{json .Image}}' |
              jq -r 'if has("config") then . else (to_entries[0].value) end | .config.Labels["io.mazedns.build"] // empty')
            echo "${label:-$PREV}"
          }
          if [ -z "$PREV" ]; then
            cp=true; agent=true
          else
            cp_changes=$(changed $shared web $(specs cmd/control-plane))
            agent_changes=$(changed $shared $(specs cmd/dns-agent))
            cp=false; agent=false
            [ -n "$cp_changes" ] && cp=true
            [ -n "$agent_changes" ] && agent=true
            echo "Control plane changes since ${PREV}:"; echo "${cp_changes:-  none}"
            echo "Agent changes since ${PREV}:"; echo "${agent_changes:-  none}"
          fi
          if [ "$cp" = true ]; then cp_build="$VERSION"; else cp_build=$(built_at control-plane); fi
          if [ "$agent" = true ]; then agent_build="$VERSION"; else agent_build=$(built_at agent); fi

          # The build matrix: only the images that changed, on both arches.
          matrix=$(jq -cn --argjson cp "$cp" --argjson agent "$agent" '
            [ (if $cp then {image: "control-plane", suffix: "control-plane"} else empty end),
              (if $agent then {image: "dns-agent", suffix: "agent"} else empty end) ] as $imgs
            | [ {arch: "amd64", runner: "ubuntu-latest", platform: "linux/amd64"},
                {arch: "arm64", runner: "ubuntu-24.04-arm", platform: "linux/arm64"} ] as $arches
            | {include: [ $imgs[] as $i | $arches[] as $a | $i + $a ]}')
          {
            echo "build_cp=$cp"
            echo "build_agent=$agent"
            echo "any=$([ "$cp" = true ] || [ "$agent" = true ] && echo true || echo false)"
            echo "cp_build=$cp_build"
            echo "agent_build=$agent_build"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Images"
            echo "- control plane: $([ "$cp" = true ] && echo rebuilt || echo "stamped, code from \`${cp_build}\`")"
            echo "- agent: $([ "$agent" = true ] && echo rebuilt || echo "stamped, code from \`${agent_build}\`")"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      # Only the images that changed (see the version job); `image` is the
      # Dockerfile target, `suffix` the published image name.
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: repo
        run: echo "image_name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            AGENT_BUILD=${{ needs.version.outputs.agent_build }}
          # io.mazedns.build: the release this code was compiled for. A stamped
          # image keeps it, which is how a later release finds where its code
          # comes from.
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.mazedns.build=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ steps.repo.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }} ${{ needs.version.outputs.version }}
    needs: [version, build]
    # Runs after a successful build, or on its own when the build was skipped
    # because neither image changed (then it stamps both).
    if: >-
      !cancelled() && needs.version.outputs.skip != 'true' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.version.outputs.any == 'false'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: [control-plane, dns-agent]
        include:
          - image: control-plane
            suffix: control-plane
          - image: dns-agent
            suffix: agent
    env:
      # Whether this image was rebuilt in this run (else it is stamped).
      REBUILT: ${{ matrix.image == 'control-plane' && needs.version.outputs.build_cp || needs.version.outputs.build_agent }}
    steps:
      - name: Set image name
        id: repo
        run: echo "image_name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        if: env.REBUILT == 'true'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Create manifest list and push
        if: env.REBUILT == 'true'
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.repo.outputs.image_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      # No compile and no layer travels: the previous release's image plus one
      # config change, on both arches (FROM + ENV + LABEL run nothing, so no
      # emulation). The binary reads MAZEDNS_IMAGE_VERSION, so it reports the new
      # version, and MAZEDNS_AGENT_BUILD tells the control plane where its agent
      # code comes from. The io.mazedns.build label is inherited untouched.
      - name: Stamp ${{ needs.version.outputs.previous }} as ${{ needs.version.outputs.version }}
        if: env.REBUILT != 'true'
        env:
          IMAGE: ${{ steps.repo.outputs.image_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PREV: ${{ needs.version.outputs.previous }}
          AGENT_BUILD: ${{ needs.version.outputs.agent_build }}
        run: |
          set -eu
          mkdir -p /tmp/stamp && cd /tmp/stamp
          cat > Dockerfile <<EOF
          FROM ${IMAGE}:${PREV}
          ENV MAZEDNS_IMAGE_VERSION=${VERSION} MAZEDNS_AGENT_BUILD=${AGENT_BUILD}
          LABEL org.opencontainers.image.version=${VERSION} org.opencontainers.image.revision=${GITHUB_SHA}
          EOF
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push \
            --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:latest" .

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ steps.repo.outputs.image_name }}:${{ needs.version.outputs.version }}"

  tag:
    name: Tag ${{ needs.version.outputs.version }}
    needs: [version, publish]
    if: >-
      !cancelled() && needs.version.outputs.skip != 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the log since the previous release, for the notes
          fetch-tags: true

      - name: Create and push the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION}"
          echo "Tagged ${VERSION} at ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      # The GitHub release carries the changelog since the previous release;
      # the control plane reads it to offer the update and show what changed.
      # A failure here doesn't undo the release: the tag and images stand.
      - name: Publish the release notes
        continue-on-error: true
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          CP_BUILD: ${{ needs.version.outputs.cp_build }}
          AGENT_BUILD: ${{ needs.version.outputs.agent_build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          RELEASE_VERSION="${VERSION}" .github/scripts/release-notes.sh "${PREVIOUS}" "${VERSION}" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release create "${VERSION}" --title "${VERSION}" --notes-file notes.md --verify-tag --latest
