# Production compose: pulls the published image and runs a master (UI) plus a
# worker (resolver + metrics). In a real multi-site deployment the worker runs on
# a separate host/site; here both are shown on one host for illustration.
#
#   MAZEDNS_ADMIN_PASSWORD=... docker compose -f docker-compose.prod.yml up -d
#
# Note: config replication master->worker arrives in Phase 6 (clustering). For
# now the worker is a standalone resolver using its own baked config.

name: mazedns

services:
  master:
    image: ghcr.io/ipmaze/mazedns:latest
    container_name: mazedns-master
    restart: unless-stopped
    environment:
      MAZEDNS_MODE: master
      MAZEDNS_API_ADDRESS: "0.0.0.0"
      MAZEDNS_DB_PATH: "/data/mazedns.db"
      MAZEDNS_ADMIN_USERNAME: "admin"
      MAZEDNS_ADMIN_PASSWORD: "${MAZEDNS_ADMIN_PASSWORD:?set a strong admin password}"
    ports:
      - "53:5300/udp"
      - "53:5300/tcp"
      - "8080:8080"     # web UI + API (keep behind your VPN / firewall)
    volumes:
      - master-data:/data

  worker:
    image: ghcr.io/ipmaze/mazedns:latest
    container_name: mazedns-worker
    restart: unless-stopped
    environment:
      MAZEDNS_MODE: worker
      MAZEDNS_API_ADDRESS: "0.0.0.0"   # worker exposes only /healthz + /metrics
      MAZEDNS_DB_PATH: "/data/mazedns.db"
    ports:
      - "5301:5300/udp"   # example second resolver on this host
      - "5301:5300/tcp"
      - "9090:8080"       # worker /metrics + /healthz
    volumes:
      - worker-data:/data

volumes:
  master-data:
  worker-data:
