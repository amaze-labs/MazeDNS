# Production compose: pulls the published images and runs a control-plane
# (dashboard/API, no DNS) plus a DNS agent that self-enrolls with a shared join
# token and serves DNS. In a real multi-site deployment each agent runs on a
# separate host/site (reaching the control plane over your private overlay); here
# both are shown on one host for illustration.
#
#   MAZEDNS_ADMIN_PASSWORD=... MAZEDNS_JOIN_TOKEN=... \
#     docker compose -f docker-compose.prod.yml up -d
#
# Agents appear in the control-plane UI (Cluster tab) automatically once they
# present the join token — no key to copy. Set MAZEDNS_REQUIRE_APPROVAL=true on
# the control plane if you want to approve each agent before it serves.

name: mazedns

services:
  control-plane:
    image: ghcr.io/ipmaze/mazedns-control-plane:latest
    container_name: mazedns-control-plane
    restart: unless-stopped
    environment:
      MAZEDNS_API_ADDRESS: "0.0.0.0"
      MAZEDNS_DB_PATH: "/data/mazedns.db"
      MAZEDNS_ADMIN_USERNAME: "admin"
      MAZEDNS_ADMIN_PASSWORD: "${MAZEDNS_ADMIN_PASSWORD:?set a strong admin password}"
      MAZEDNS_CLUSTER_ENABLED: "true"
      MAZEDNS_JOIN_TOKEN: "${MAZEDNS_JOIN_TOKEN:?set a shared cluster join token}"
      # MAZEDNS_REQUIRE_APPROVAL: "true"   # hold new agents until you approve them
      # --- SSO via OIDC (optional) — uncomment and fill in to enable a
      #     "Sign in with SSO" button without editing the config file:
      # MAZEDNS_OIDC_ISSUER: "https://id.example.com/application/o/mazedns/"
      # MAZEDNS_OIDC_CLIENT_ID: "mazedns"
      # MAZEDNS_OIDC_CLIENT_SECRET: "${MAZEDNS_OIDC_CLIENT_SECRET:-}"
      # MAZEDNS_OIDC_REDIRECT_URL: "https://dns.example.com/api/auth/oidc/callback"
      # MAZEDNS_OIDC_GROUPS_CLAIM: "groups"
      # MAZEDNS_OIDC_ADMIN_GROUP: "mazedns-admins"
    ports:
      - "8080:8080"     # web UI + API (keep behind your VPN / firewall)
    volumes:
      - control-plane-data:/data

  dns-agent:
    image: ghcr.io/ipmaze/mazedns-dns-agent:latest
    container_name: mazedns-agent
    restart: unless-stopped
    depends_on: [control-plane]
    environment:
      MAZEDNS_DB_PATH: "/data/mazedns.db"
      MAZEDNS_CP_URL: "http://control-plane:8080"
      MAZEDNS_JOIN_TOKEN: "${MAZEDNS_JOIN_TOKEN:?set a shared cluster join token}"
      MAZEDNS_NODE_NAME: "agent-1"
    ports:
      - "53:5300/udp"
      - "53:5300/tcp"
      - "9090:8080"       # agent /metrics + /healthz
    volumes:
      - agent-data:/data

volumes:
  control-plane-data:
  agent-data:
