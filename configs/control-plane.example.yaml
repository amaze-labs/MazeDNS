# MazeDNS — control-plane example config (pure-binary deployments).
#
# Run:  ./control-plane --config control-plane.yaml
#
# The control plane runs the API, web UI, auth, domain classifier, cluster
# coordination, and dashboard aggregation. It NEVER serves DNS — every query is
# answered by the dns-agent fleet — so this file has no listen/upstreams/cache/
# filter sections. Any resolver setting omitted here falls back to a harmless
# built-in default (the control plane just doesn't use it).
#
# The control plane is configured through its WEB UI. On a fresh install it starts a
# first-boot wizard (create admin or configure SSO, DNS defaults, first enrollment
# key). There is NO setup token — setup uses trust-on-first-use, so don't expose the
# API port publicly until the wizard is complete. Everything below is OPTIONAL: the
# `auth`, `oidc`,
# `cluster` policy, `classifier`, and `metrics` sections only SEED the database on
# first boot — afterwards they are ignored and you edit them under Settings. Only
# `api` (bind), `database`, and `log.level` are read on every start.
#
# Reset a lost admin:  ./control-plane reset-admin --username admin

api:
  enabled: true
  address: "127.0.0.1"         # UI + API + /metrics + /healthz; keep it off the public internet (or MAZEDNS_API_ADDRESS)
  port: 8080                   # put a TLS reverse proxy in front for remote access

# --- Everything below is SEED-ONLY (first boot); edit live under Settings later ---

auth:
  enabled: true                # require login for the API + UI
  session_ttl: "24h"           # seed; edit under Settings → Access
  # The first admin is created by the setup wizard, not here.
  oidc:                        # seed for SSO; edit under Settings → Access & SSO
    enabled: false
    issuer: ""                 # e.g. https://authentik.example.com/application/o/mazedns/
    client_id: ""
    client_secret: ""
    redirect_url: ""           # e.g. https://dns.example.com/api/auth/oidc/callback (must match the provider exactly)
    scopes: []
    groups_claim: "groups"
    admin_group: ""            # members of this group get the admin role
    disable_password_login: false  # true = SSO only (no local login)
    auto_login: false              # true = redirect straight to the SSO provider

cluster:                       # control-plane side of config replication
  # The control plane always serves cluster endpoints — clustering has no enable
  # flag. Enrollment keys are managed in the UI (Cluster → Enrollment keys): create,
  # list, and revoke keys with an optional expiry and max-uses. Agents present a
  # key as MAZEDNS_JOIN_TOKEN to join. The policy fields below are seed-only —
  # edit them under Settings → Access → Cluster policy.
  join_token: ""               # DEPRECATED: if set, auto-imported once as a never-expiring enrollment key on boot (prefer the UI).
  require_approval: false      # hold self-enrolled agents until an admin approves them
  key_max_age: 720h            # rotate a node's key once older than this (default 720h/30d)
  key_grace: 15m               # how long the previous key stays valid after a rotation

classifier:                    # optional domain classification (static signals + optional LLM). Control plane only.
  # These values SEED the database on first run; afterwards edit them live in the
  # UI under Settings → "AI classification" (no restart needed).
  enabled: false               # off by default
  endpoint: "http://localhost:11434/v1"  # OpenAI-compatible base (Ollama/llama.cpp/LM Studio)
  model: "llama3.2"
  api_key: ""                  # usually empty for local models
  mode: "suggest"              # off | suggest (approve before blocking) | auto (block immediately)
  min_gap_ms: 1000             # rate-limit between model calls
  timeout_sec: 60              # per-request timeout (raise it if a local model warms up slowly)
  trusted_disable_default: false  # true = don't use the built-in public trusted list (Majestic Million)
  trusted_list_url: ""            # optional extra custom trusted list (URL or file path)
  trusted_top_n: 0                # cap the built-in ranked list (0 = top 100k)
  # Built-in public threat-intel feeds to enable (merged). Available keys:
  # urlhaus, threatfox, phishing_army, hagezi_tif, openphish.
  threat_feeds: ["urlhaus", "threatfox", "phishing_army", "hagezi_tif"]
  threat_list_url: ""             # extra custom threat lists (one per line / comma-separated)
  whois_enabled: true             # enrich verdicts with RDAP/WHOIS registration data (domain age, registrar)
  vt_enabled: false               # VirusTotal domain reputation (key-gated)
  vt_api_key: ""
  abuseipdb_enabled: false        # AbuseIPDB IP reputation (key-gated)
  abuseipdb_api_key: ""

database:
  driver: "sqlite"             # "sqlite" (default, embedded) | "postgres" (external)
  path: "mazedns.db"           # sqlite: database file (relative to the working dir); or MAZEDNS_DB_PATH
  # External PostgreSQL (recommended when running more than one control plane / for backups):
  # driver: "postgres"
  # dsn: "postgres://user:pass@db-host:5432/mazedns?sslmode=disable"   # or MAZEDNS_DB_DSN

log:
  level: "info"                # debug|info|warn|error (or MAZEDNS_LOG_LEVEL)

metrics:
  victoria_metrics:            # push the control plane's own process metrics to VictoriaMetrics
    enabled: false
    url: "http://victoriametrics:8428"   # VM base URL (import endpoint is /api/v1/import/prometheus)
    interval: "15s"
    job: "mazedns"
    instance: ""               # empty -> hostname
    username: ""               # optional HTTP basic auth
    password: ""
  victoria_logs:               # ship the cluster-wide query log (control plane holds it) to VictoriaLogs
    enabled: false
    url: "http://victorialogs:9428"      # VL base URL (ingest endpoint is /insert/jsonline)
    interval: "15s"
    username: ""
    password: ""
