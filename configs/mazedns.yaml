# MazeDNS sample config.
#
# Bootstrap settings (listen/api addresses + ports, tls, database, auth/oidc)
# are read from this file (or env) on every start.
#
# Operational settings (upstreams, forwarders, rate_limit, dnssec, cache,
# filter.block_response) are only SEEDED from this file on first run — after
# that they live in the database and are edited from the Settings tab in the UI.
# Editing them here later has no effect unless the DB has no settings row yet.
listen:
  address: "0.0.0.0"
  port: 53                # standard DNS port. For local non-root dev (macOS/Linux reserve <1024 for root), override with MAZEDNS_LISTEN_PORT=5300

upstreams:                # default upstreams; tried in order, first to answer wins
  - "1.1.1.1:53"          # plain UDP (TCP fallback)
  - "9.9.9.9:53"
  # Encrypted upstreams are supported too:
  # - "tls://1.1.1.1:853#cloudflare-dns.com"   # DNS-over-TLS (servername after #)
  # - "https://dns.quad9.net/dns-query"         # DNS-over-HTTPS

forwarders: []            # split-horizon: e.g. - { suffix: "corp.internal", upstreams: ["udp://10.0.0.53:53"] }

rate_limit:
  enabled: false
  qpm: 600                # max queries per minute per client IP (REFUSED beyond)

dnssec:
  enabled: false          # force the DO bit upstream and surface the AD flag

zones: []                 # authoritative zones, e.g.
                          # - name: "home.lan"
                          #   records:
                          #     - { name: "@",   type: "A", value: "192.168.1.1" }
                          #     - { name: "nas", type: "A", value: "192.168.1.10" }

# Encrypted DNS endpoints for clients (uses a self-signed cert if tls.* is empty)
dot:
  enabled: false
  address: "0.0.0.0"
  port: 853               # DNS-over-TLS
doh:
  enabled: false
  address: "0.0.0.0"
  port: 8443              # DNS-over-HTTPS
  path: "/dns-query"
tls:
  cert_file: ""           # PEM cert; empty -> self-signed generated on start
  key_file: ""

cache:
  enabled: true
  max_entries: 10000
  min_ttl: "10s"
  max_ttl: "24h"

filter:
  enabled: true
  block_response: "nxdomain"   # "nxdomain" or "zeroip" (0.0.0.0 / ::)
  # Ships EMPTY: a fresh install blocks nothing until you opt in. Add blocklists
  # in the UI (Filtering → Blocklists), or load files here / via the
  # MAZEDNS_BLOCKLIST_FILES env var (e.g. a mounted StevenBlack/OISD list).
  # Paths are relative to this config file. Example:
  #   blocklist_files:
  #     - "blocklist.hosts"
  blocklist_files: []

api:
  enabled: true
  address: "127.0.0.1"         # keep the control plane off the public internet
  port: 8080                   # http://127.0.0.1:8080  ->  /api, /metrics, /healthz

classifier:                    # optional LLM domain classification (master only)
  # These values SEED the database on first run; afterwards edit them live in the
  # UI under Settings → "AI classification" (no restart needed).
  enabled: false               # off by default; needs a local model endpoint
  endpoint: "http://localhost:11434/v1"  # OpenAI-compatible base (Ollama/llama.cpp/LM Studio)
  model: "llama3.2"            # model name your local server serves
  api_key: ""                  # usually empty for local models
  mode: "suggest"              # off | suggest (approve before blocking) | auto (block immediately)
  min_gap_ms: 1000             # rate-limit between model calls
  timeout_sec: 60              # per-request timeout (raise it if a local model warms up slowly)
  # Trusted list (reduce false positives): domains here are never blocked even if
  # the model flags them. The built-in public list (Majestic Million top domains)
  # is used automatically unless disabled; add your own as an extra source.
  trusted_disable_default: false  # set true to NOT use the built-in public trusted list
  trusted_list_url: ""            # optional extra custom trusted list (URL or file path)
  trusted_top_n: 0                # cap the built-in ranked list (0 = top 100k)
  # Threat-intel list (corroborate malicious verdicts): a domain here boosts a
  # malicious score and is flagged even if the model missed it. Built-in public
  # default is abuse.ch URLhaus.
  # Built-in public threat-intel feeds to enable (merged). Available keys:
  # urlhaus, threatfox, phishing_army, hagezi_tif, openphish.
  threat_feeds: ["urlhaus", "threatfox", "phishing_army", "hagezi_tif"]
  threat_list_url: ""             # extra custom threat lists (one per line / comma-separated)
  # Enrich each classification with WHOIS/RDAP registration data (domain age,
  # registrar) — a strong signal for the model. One RDAP lookup per new domain.
  whois_enabled: true
  # Reputation services (optional, key-gated): corroborate verdicts. A clean
  # report raises the legitimacy score (fewer false positives); a malicious one
  # lowers it. VirusTotal checks the domain; AbuseIPDB checks its resolved IP.
  vt_enabled: false
  vt_api_key: ""
  abuseipdb_enabled: false
  abuseipdb_api_key: ""

cluster:                       # control-plane <-> dns-agent config replication
  enabled: false               # agent: start the sync agent (auto-enabled when cp_url + join_token/node_key are set)
  # --- control-plane side ---
  join_token: ""               # shared secret agents present to self-enroll (or MAZEDNS_JOIN_TOKEN); '' disables auto-join
  require_approval: false      # hold self-enrolled agents until an admin approves them (or MAZEDNS_REQUIRE_APPROVAL)
  # --- agent side ---
  cp_url: ""                   # agent: control-plane base URL (or MAZEDNS_CP_URL)
  master_ip: ""                # agent: pin the control-plane IP to skip DNS (or MAZEDNS_CP_IP); TLS still uses the URL host
  node_name: ""                # agent: name to enroll under (or MAZEDNS_NODE_NAME; defaults to the hostname)
  node_key: ""                 # agent: per-node API key (auto-issued via join_token; or MAZEDNS_NODE_KEY)
  interval: "30s"              # agent: snapshot poll interval

database:
  driver: "sqlite"             # "sqlite" (default, embedded) | "postgres" (external)
  path: "mazedns.db"           # sqlite: database file (relative to the working dir)
  # For an external PostgreSQL server, set driver: postgres and a DSN:
  # dsn: "postgres://user:pass@db-host:5432/mazedns?sslmode=disable"

auth:
  enabled: true                # require login for the API + UI (enforced by default)
  session_ttl: "24h"
  admin:                       # first-run bootstrap admin
    username: "admin"          # or set MAZEDNS_ADMIN_USERNAME
    password: ""               # or MAZEDNS_ADMIN_PASSWORD; empty -> random, logged once
  oidc:                        # Authentik (or any OIDC provider) SSO
    enabled: false
    issuer: ""                 # e.g. https://authentik.example.com/application/o/mazedns/
    client_id: ""
    client_secret: ""
    redirect_url: ""           # e.g. http://127.0.0.1:8080/api/auth/oidc/callback
    scopes: []
    groups_claim: "groups"
    admin_group: ""            # members of this group get the admin role
    disable_password_login: false  # true = SSO only (no local username/password); also MAZEDNS_OIDC_DISABLE_PASSWORD_LOGIN
    auto_login: false              # true = redirect straight to SSO; also MAZEDNS_OIDC_AUTO_LOGIN

log:
  level: "info"                # debug|info|warn|error
  query_log: false             # set true to log every query

metrics:
  victoria_metrics:            # push Prometheus metrics to VictoriaMetrics (each node pushes its own)
    enabled: false
    url: "http://victoriametrics:8428"   # VM base URL (import endpoint is /api/v1/import/prometheus)
    interval: "15s"
    job: "mazedns"             # job label applied in VM
    instance: ""               # instance label; empty -> hostname
    username: ""               # optional HTTP basic auth
    password: ""
  victoria_logs:               # ship the cluster-wide query log (master) to VictoriaLogs
    enabled: false
    url: "http://victorialogs:9428"      # VL base URL (ingest endpoint is /insert/jsonline)
    interval: "15s"
    username: ""               # optional HTTP basic auth
    password: ""
