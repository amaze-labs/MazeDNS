# MazeDNS sample config.
#
# Bootstrap settings (listen/api addresses + ports, tls, database, auth/oidc)
# are read from this file (or env) on every start.
#
# Operational settings (upstreams, forwarders, rate_limit, dnssec, cache,
# filter.block_response) are only SEEDED from this file on first run — after
# that they live in the database and are edited from the Settings tab in the UI.
# Editing them here later has no effect unless the DB has no settings row yet.
listen:
  address: "0.0.0.0"
  port: 5300              # non-privileged dev port (macOS reserves 5353 for mDNS); map host 53 -> 5300 in Docker

upstreams:                # default upstreams; tried in order, first to answer wins
  - "1.1.1.1:53"          # plain UDP (TCP fallback)
  - "9.9.9.9:53"
  # Encrypted upstreams are supported too:
  # - "tls://1.1.1.1:853#cloudflare-dns.com"   # DNS-over-TLS (servername after #)
  # - "https://dns.quad9.net/dns-query"         # DNS-over-HTTPS

forwarders: []            # split-horizon: e.g. - { suffix: "corp.internal", upstreams: ["udp://10.0.0.53:53"] }

rate_limit:
  enabled: false
  qpm: 600                # max queries per minute per client IP (REFUSED beyond)

dnssec:
  enabled: false          # force the DO bit upstream and surface the AD flag

zones: []                 # authoritative zones, e.g.
                          # - name: "home.lan"
                          #   records:
                          #     - { name: "@",   type: "A", value: "192.168.1.1" }
                          #     - { name: "nas", type: "A", value: "192.168.1.10" }

# Encrypted DNS endpoints for clients (uses a self-signed cert if tls.* is empty)
dot:
  enabled: false
  address: "0.0.0.0"
  port: 853               # DNS-over-TLS
doh:
  enabled: false
  address: "0.0.0.0"
  port: 8443              # DNS-over-HTTPS
  path: "/dns-query"
tls:
  cert_file: ""           # PEM cert; empty -> self-signed generated on start
  key_file: ""

cache:
  enabled: true
  max_entries: 10000
  min_ttl: "10s"
  max_ttl: "24h"

filter:
  enabled: true
  block_response: "nxdomain"   # "nxdomain" or "zeroip" (0.0.0.0 / ::)
  # Ships EMPTY: a fresh install blocks nothing until you opt in. Add blocklists
  # in the UI (Filtering → Blocklists), or load files here / via the
  # MAZEDNS_BLOCKLIST_FILES env var (e.g. a mounted StevenBlack/OISD list).
  # Paths are relative to this config file. Example:
  #   blocklist_files:
  #     - "blocklist.hosts"
  blocklist_files: []

api:
  enabled: true
  address: "127.0.0.1"         # keep the control plane off the public internet
  port: 8080                   # http://127.0.0.1:8080  ->  /api, /metrics, /healthz

classifier:                    # optional LLM domain classification (master only)
  # These values SEED the database on first run; afterwards edit them live in the
  # UI under Settings → "AI classification" (no restart needed).
  enabled: false               # off by default; needs a local model endpoint
  endpoint: "http://localhost:11434/v1"  # OpenAI-compatible base (Ollama/llama.cpp/LM Studio)
  model: "llama3.2"            # model name your local server serves
  api_key: ""                  # usually empty for local models
  mode: "suggest"              # off | suggest (approve before blocking) | auto (block immediately)
  min_gap_ms: 1000             # rate-limit between model calls
  timeout_sec: 60              # per-request timeout (raise it if a local model warms up slowly)
  # Reduce false positives: a public list of known-legitimate domains. When the
  # model flags one of these it is never auto-blocked, only suggested for review.
  trusted_list_url: ""         # URL or file path (plain/hosts/ranked-CSV, e.g. a Tranco top-sites list)
  trusted_top_n: 0             # cap entries loaded from a large ranked list (0 = all)

cluster:                       # master<->worker config replication
  enabled: false               # worker: start the sync agent (auto-enabled when master_url+node_key are set). The master's control plane is always on — enroll nodes in the UI.
  master_url: ""               # worker: master base URL (or MAZEDNS_MASTER_URL)
  master_ip: ""                # worker: pin the master's IP to skip DNS (or MAZEDNS_MASTER_IP); TLS still uses the URL host
  node_key: ""                 # worker: per-node API key from the master (or MAZEDNS_NODE_KEY)
  interval: "30s"              # worker: snapshot poll interval

database:
  path: "mazedns.db"           # SQLite file (relative to the working directory)

auth:
  enabled: true                # require login for the API + UI (enforced by default)
  session_ttl: "24h"
  admin:                       # first-run bootstrap admin
    username: "admin"          # or set MAZEDNS_ADMIN_USERNAME
    password: ""               # or MAZEDNS_ADMIN_PASSWORD; empty -> random, logged once
  oidc:                        # Authentik (or any OIDC provider) SSO
    enabled: false
    issuer: ""                 # e.g. https://authentik.example.com/application/o/mazedns/
    client_id: ""
    client_secret: ""
    redirect_url: ""           # e.g. http://127.0.0.1:8080/api/auth/oidc/callback
    scopes: []
    groups_claim: "groups"
    admin_group: ""            # members of this group get the admin role

log:
  level: "info"                # debug|info|warn|error
  query_log: false             # set true to log every query
