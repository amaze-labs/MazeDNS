# Production compose: pulls the published images and runs a control-plane
# (dashboard/API, no DNS) plus a DNS agent that self-enrolls with an enrollment key
# and serves DNS. In a real multi-site deployment each agent runs on a separate
# host/site (reaching the control plane over your private overlay); here both are
# shown on one host for illustration.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# On first boot the control plane starts in setup mode — there is NO setup token.
# It uses trust-on-first-use: whoever reaches the fresh control plane first completes
# setup, so do NOT expose port 8080 publicly until you've finished the wizard. Open
# http://<host>:8080 and complete it: create your admin (or configure SSO), set DNS
# defaults, and create the first enrollment key. Everything else (SSO, metrics,
# cluster policy) is configured in the UI under Settings — no env vars, no YAML, no
# restart. The agent below presents MAZEDNS_JOIN_TOKEN as its enrollment key; paste
# the key from the wizard into your environment (or into the agent service) to join.
#
# Required environment (set in your shell or a .env file next to this compose file):
#   MAZEDNS_CP_IP       IP where the agent host reaches the control plane
#                       (single-host setup: this host's own LAN IP)
#   MAZEDNS_JOIN_TOKEN  enrollment key from the setup wizard / Cluster page

name: mazedns

services:
  control-plane:
    image: ghcr.io/ipmaze/mazedns-control-plane:latest
    container_name: mazedns-control-plane
    restart: unless-stopped
    # The control plane is configured entirely through the web UI (first-boot wizard
    # + Settings). Only bootstrap values live here: where to store data and how to
    # bind the HTTP server. To reset a lost admin: `docker compose exec control-plane
    # /control-plane reset-admin`.
    environment:
      MAZEDNS_API_ADDRESS: "0.0.0.0"
      MAZEDNS_DB_PATH: "/data/mazedns.db"
    ports:
      - "8080:8080"     # web UI + API (keep behind your VPN / firewall)
    volumes:
      - control-plane-data:/data

  dns-agent:
    image: ghcr.io/ipmaze/mazedns-dns-agent:latest
    container_name: mazedns-agent
    restart: unless-stopped
    depends_on: [control-plane]
    # Host networking (the default here, recommended): the agent binds the host's
    # own :53 directly, so the resolver sees each client's REAL source IP
    # (per-client dashboard stats) and the control plane records this node's real
    # host IP — under bridge networking both collapse to a docker bridge address
    # like 172.18.0.2. The agent binds :53 out of the box — its baked config
    # defaults to port 53 and the binary carries CAP_NET_BIND_SERVICE, no root
    # needed. Host networking has no compose DNS, so the control plane's IP MUST
    # be pinned: set MAZEDNS_CP_IP in your environment (or a .env file) to the IP
    # where this host reaches the control plane (with this single-host file:
    # the host's own LAN IP). DNS is bypassed for the CP dial only; TLS still
    # verifies the URL host.
    network_mode: host
    environment:
      MAZEDNS_API_ADDRESS: "0.0.0.0"     # agent /healthz + /metrics
      MAZEDNS_API_PORT: "9090"           # keep :8080 free for the control plane on this host
      MAZEDNS_DB_PATH: "/data/mazedns.db"
      MAZEDNS_CP_URL: "http://${MAZEDNS_CP_IP:?set MAZEDNS_CP_IP to the IP where this host reaches the control plane}:8080"
      MAZEDNS_CP_IP: "${MAZEDNS_CP_IP:?set MAZEDNS_CP_IP to the IP where this host reaches the control plane}"
      # Enrollment key created in the setup wizard / Cluster → Enrollment keys.
      MAZEDNS_JOIN_TOKEN: "${MAZEDNS_JOIN_TOKEN:?paste the enrollment key from the setup wizard}"
      MAZEDNS_NODE_NAME: "agent-1"
    volumes:
      - agent-data:/data
    # --- Bridge networking (alternative) ---------------------------------------
    # If you can't use host networking, remove `network_mode: host` and
    # MAZEDNS_API_PORT above, set MAZEDNS_CP_URL back to the compose service name
    # (http://control-plane:8080, MAZEDNS_CP_IP no longer needed), and publish the
    # ports below. Client IPs and this node's IP will then show as the docker
    # bridge address instead of the real ones.
    # ports:
    #   - "53:53/udp"
    #   - "53:53/tcp"
    #   - "9090:8080"       # agent /metrics + /healthz

volumes:
  control-plane-data:
  agent-data:
