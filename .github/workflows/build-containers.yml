# On every push to main:
#   1. compute the next version from the latest semver tag plus the commits after
#      it (type!: major, feat: minor, anything else: patch — see
#      .github/scripts/next-version.sh);
#   2. publish BOTH images (control plane and agent) as <version> and latest:
#      rebuilt when anything that ends up in the binaries changed since the
#      previous release, otherwise the previous release is retagged;
#   3. only once both images are published, create and push the git tag <version>
#      (no "v" prefix).
#
# The two images always carry the same version, and each binary reports it
# (--version, and the app version agents send to the control plane, which the
# Cluster page compares to flag outdated agents). That is why they are rebuilt or
# retagged TOGETHER: retagging only one would leave it reporting the old version.
#
# Pushing the tag does not re-trigger this workflow (it only runs on branches).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in order: two quick pushes must not compute the same
# version.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write   # push the tag
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
      skip: ${{ steps.next.outputs.skip }}
      build: ${{ steps.changed.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history for git describe and the log
          fetch-tags: true

      - name: Next version
        id: next
        run: |
          set -eu
          version=$(.github/scripts/next-version.sh)
          previous=$(.github/scripts/next-version.sh --previous)
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "HEAD is already tagged ${version}: nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

      # The comparison is against the last RELEASED version, not the previous
      # push: a release that failed halfway doesn't leave an image behind. A git
      # tag only exists once both images were published (see the `tag` job), so
      # both images of `previous` are guaranteed to exist and can be retagged.
      #
      # The paths list what ends up in the binaries or the images. Err on the
      # side of too many: an extra path costs a useless build, a missing one
      # ships a stale image.
      - name: Did anything in the images change?
        id: changed
        if: steps.next.outputs.skip != 'true'
        env:
          PREV: ${{ steps.next.outputs.previous }}
        run: |
          set -eu
          paths="cmd internal web configs go.mod go.sum Dockerfile .dockerignore"
          if [ -z "$PREV" ]; then
            echo "No previous release: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREV" HEAD -- $paths; then
            echo "Nothing changed in '${paths}' since ${PREV}: retagging."
            echo "### Images retagged from \`${PREV}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since ${PREV}:"
            git diff --name-only "$PREV" HEAD -- $paths
            echo "### Images rebuilt" >> "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        image: [control-plane, dns-agent]
        arch: [amd64, arm64]
        # `image` is the Dockerfile target; `suffix` is the published image name.
        # suffix + runner + platform are attached per axis (not extra axes).
        include:
          - image: control-plane
            suffix: control-plane
          - image: dns-agent
            suffix: agent
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: repo
        run: echo "image_name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.repo.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }} ${{ needs.version.outputs.version }}
    needs: [version, build]
    # Runs after a successful build, or on its own when the build was skipped
    # because nothing changed (then it retags the previous release).
    if: >-
      !cancelled() && needs.version.outputs.skip != 'true' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.version.outputs.build == 'false'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: [control-plane, dns-agent]
        include:
          - image: control-plane
            suffix: control-plane
          - image: dns-agent
            suffix: agent
    steps:
      - name: Set image name
        id: repo
        run: echo "image_name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        if: needs.version.outputs.build == 'true'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Create manifest list and push
        if: needs.version.outputs.build == 'true'
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.repo.outputs.image_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      # No layers travel: this adds tags to the same manifest, a metadata-only
      # operation in the registry. Older tags stay where they are.
      - name: Retag from ${{ needs.version.outputs.previous }}
        if: needs.version.outputs.build == 'false'
        env:
          IMAGE: ${{ steps.repo.outputs.image_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PREV: ${{ needs.version.outputs.previous }}
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${PREV}"

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ steps.repo.outputs.image_name }}:${{ needs.version.outputs.version }}"

  tag:
    name: Tag ${{ needs.version.outputs.version }}
    needs: [version, publish]
    if: >-
      !cancelled() && needs.version.outputs.skip != 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and push the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION}"
          echo "Tagged ${VERSION} at ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
